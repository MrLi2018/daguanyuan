services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/topics"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://server:8080

  agents:
    build:
      context: ./examples/agents
      dockerfile: Dockerfile
    depends_on:
      server:
        condition: service_healthy
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - DOUBAO_API_KEY=${DOUBAO_API_KEY:-}
    command: ["python", "agent_runner.py", "--server", "http://server:8080", "--rounds", "5"]
